<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>STICK//RAGE | Combat Prototype 0.2</title>
<style>
body{margin:0;background:#0a0e15;color:#edf3fa;font-family:system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:16px;box-sizing:border-box}#sr2{width:min(100%,1000px);box-sizing:border-box;background:#10151e;color:#edf3fa;padding:12px;border-radius:12px;font-family:system-ui,sans-serif;user-select:none}#sr2 *{box-sizing:border-box}#sr2 canvas{width:100%;display:block;border-radius:6px;outline:none;touch-action:none}#sr2 button{font:700 12px system-ui;color:white;background:#293445;border:1px solid #526175;border-radius:7px;padding:12px 15px;cursor:pointer;touch-action:none}#sr2 button:active,#sr2 button.held{background:#647c97}#sr2 .atk{background:#702e39;border-color:#ab4b56}#sr2 .def{background:#21516b;border-color:#4485aa}#sr2 .row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}#sr2 .group{display:flex;gap:5px;flex-wrap:wrap}#sr2 .small{font-size:11px;color:#a5b2c4;line-height:1.6}#sr2 :focus-visible{outline:2px solid #78d9ff;outline-offset:3px}
</style></head><body>
<main id="sr2">
<div class="row" style="margin-bottom:12px"><div><div style="font-size:24px;font-weight:950;font-style:italic;letter-spacing:2px">STICK<span style="color:#ff515c">//</span>RAGE</div><div class="small">COMBAT EVOLUTION • V0.2</div></div><button id="sr2reset">Start / Restart</button></div>
<canvas width="800" height="420" tabindex="0" aria-label="Fighting game: A and D to move, W or Space to jump, double tap jump to fly kick, J punch, K kick, hold I to block, L dash."></canvas>
<div class="row" style="margin-top:12px;align-items:flex-start"><div><div class="small">MOVEMENT</div><div class="group"><button data-k="a">◀ A</button><button data-k="d">D ▶</button><button data-k="w">Jump W</button></div></div><div><div class="small">COMBAT</div><div class="group"><button class="def" data-k="i">Block I</button><button class="atk" data-k="j">Punch J</button><button class="atk" data-k="k">Kick K</button><button data-k="l">Dash L</button></div></div></div>
<div class="small" style="margin-top:10px">Double-tap W or Space for a flying kick. Hold I to block. Click the arena to use keyboard controls.</div>
<div class="row" style="margin-top:8px"><div class="small" id="sr2status" aria-live="polite">Ready to fight.</div><label class="small"><input type="checkbox" id="sr2easy"> Easier opponent</label><label class="small"><input type="checkbox" id="sr2sound" checked> Sound</label></div></main>
<script>
(()=>{
const root=document.getElementById('sr2'),c=root.querySelector('canvas'),g=c.getContext('2d'),W=800,H=420,F=340;
const moves={punch:{dur:.21,hit:.065,dmg:8,range:88,force:220},kick:{dur:.29,hit:.095,dmg:14,range:116,force:440},fly:{dur:.40,hit:.065,dmg:20,range:125,force:570}};
let p,e,keys={},fx=[],labels=[],trails=[],shake=0,stop=0,combo=0,ct=0,score=0,time=0,result='',started=false,last=performance.now(),jumpAt=-100,blocks=0,audio;
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n)), lerp=(a,b,k)=>a+(b-a)*k;
function make(x,enemy){return{x,y:F,vx:0,vy:0,face:enemy?-1:1,hp:100,enemy,col:enemy?'#ff5864':'#f2f5fa',atk:null,at:0,hit:false,buffer:null,stun:0,inv:0,dash:0,guard:false,guardTime:0,cool:enemy?.55:0,phase:0,pose:null,dead:false}}
function reset(go=true){p=make(190,false);e=make(620,true);keys={};fx=[];labels=[];trails=[];shake=stop=combo=ct=score=time=blocks=0;jumpAt=-100;result='';started=go;root.querySelector('#sr2status').textContent=go?'Fight!':'Press Start or any control.';if(go)c.focus()}
function attack(f,a){if(f.dead||f.stun>0)return;if(f.atk){f.buffer=a;return}f.guard=false;f.atk=a;f.at=0;f.hit=false;if(a==='fly'){f.vx=f.face*650;f.vy=Math.min(f.vy,0)}}
function begin(k){if(k==='r'){reset();return}if(!started)started=true;if(result)return;
if(k==='w'){if(p.y>=F-.5&&p.stun<=0){p.y=F-1;p.vy=-710;jumpAt=time;burst(p.x,F,'#9daabc',8,100)}else if(time-jumpAt<.52&&p.stun<=0){p.atk=null;p.buffer=null;attack(p,'fly');jumpAt=-100}}
if(k==='j')attack(p,'punch');if(k==='k')attack(p,p.y<F-8?'fly':'kick');if(k==='l'&&p.dash<=0&&p.stun<=0){p.atk=null;p.buffer=null;p.dash=.15;p.inv=.17;p.vx=p.face*970}}
function norm(k){return({' ':'w',ArrowUp:'w',ArrowLeft:'a',ArrowRight:'d',ArrowDown:'i'})[k]||k.toLowerCase()}
c.addEventListener('keydown',ev=>{let k=norm(ev.key);if('adwjkilr'.includes(k)&&k.length===1){ev.preventDefault();if(!keys[k])begin(k);keys[k]=true}});c.addEventListener('keyup',ev=>{keys[norm(ev.key)]=false});c.addEventListener('blur',()=>keys={});window.addEventListener('blur',()=>keys={});c.addEventListener('pointerdown',()=>c.focus());
root.querySelectorAll('[data-k]').forEach(b=>{let k=b.dataset.k;b.addEventListener('pointerdown',ev=>{ev.preventDefault();b.setPointerCapture(ev.pointerId);if(!keys[k])begin(k);keys[k]=true;b.classList.add('held')});['pointerup','pointercancel','lostpointercapture'].forEach(n=>b.addEventListener(n,()=>{keys[k]=false;b.classList.remove('held')}))});root.querySelector('#sr2reset').onclick=()=>reset();
function burst(x,y,col,n,force){for(let i=0;i<n;i++){let a=Math.random()*6.283,s=force*(.25+Math.random());fx.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.15+Math.random()*.25,col})}}
function word(x,y,t,col){labels.push({x,y,t,col,life:.65})}
function sound(block,heavy){if(!root.querySelector('#sr2sound').checked)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let o=audio.createOscillator(),v=audio.createGain(),t=audio.currentTime;o.type=block?'sine':heavy?'sawtooth':'triangle';o.frequency.setValueAtTime(block?620:heavy?125:210,t);o.frequency.exponentialRampToValueAtTime(block?190:35,t+.1);v.gain.setValueAtTime(.045,t);v.gain.exponentialRampToValueAtTime(.001,t+.13);o.connect(v);v.connect(audio.destination);o.start();o.stop(t+.14)}catch(_){}}
function strike(a,b){let m=moves[a.atk],dx=b.x-a.x;if(b.dead||b.inv>0||dx*a.face<-10||Math.abs(dx)>m.range||Math.abs(a.y-b.y)>70)return;
a.hit=true;let guarded=b.guard&&dx*b.face<=10&&b.y>=F-5,dmg=a.enemy?Math.round(m.dmg*.83):m.dmg;
if(guarded){dmg=Math.max(1,Math.round(dmg*.1));b.vx=a.face*85;b.inv=.09;shake=3;stop=.025;burst(b.x+b.face*15,b.y-76,'#75d9ff',14,160);word(b.x,b.y-125,'BLOCK','#7cddff');sound(true,false);if(!b.enemy){blocks++;root.querySelector('#sr2status').textContent='Blocked! Counterattack now.'}}
else{b.stun=a.atk==='punch'?.13:.23;b.inv=.075;b.atk=null;b.buffer=null;b.guard=false;b.vx=a.face*m.force;b.vy=a.atk==='punch'?-45:-150;b.y-=1;shake=a.atk==='punch'?4:9;stop=a.atk==='punch'?.026:.043;burst((a.x+b.x)/2,b.y-70,'#ffca7c',a.atk==='punch'?15:23,340);word(b.x,b.y-120,'-'+dmg,'#ffd28b');sound(false,a.atk!=='punch');if(!a.enemy){combo++;ct=1.9;score+=dmg*10+combo*12}else{combo=0}}
b.hp=Math.max(0,b.hp-dmg);if(b.hp===0){b.dead=true;b.guard=false;b.vx=a.face*510;b.vy=-250;result=b.enemy?'VICTORY':'DEFEAT';shake=14;stop=.075;root.querySelector('#sr2status').textContent=result}}
function update(dt){if(!started)return;if(stop>0){stop-=dt;return}if(!result)time+=dt;shake=Math.max(0,shake-dt*60);ct-=dt;if(ct<0)combo=0;let dir=(keys.d?1:0)-(keys.a?1:0);
if(!result){if(p.stun<=0){if(dir&&!p.atk&&p.dash<=0)p.face=dir;p.guard=!!keys.i&&!p.atk&&p.dash<=0&&p.y>=F-1;if(p.guard)p.face=e.x>=p.x?1:-1;if(p.dash>0){p.vx=p.face*930;trails.push({x:p.x,y:p.y,face:p.face,life:.11})}else if(p.atk!=='fly')p.vx=lerp(p.vx,dir*(p.guard?120:p.atk?250:425),Math.min(1,dt*27))}else p.guard=false;
let dx=p.x-e.x,dist=Math.abs(dx),easy=root.querySelector('#sr2easy').checked;e.cool-=dt;e.guardTime-=dt;
if(e.stun<=0&&!e.dead&&!e.atk){e.face=dx>=0?1:-1;if(e.guardTime>0){e.guard=true;e.vx=lerp(e.vx,0,dt*22)}else{e.guard=false;if(!easy&&p.atk&&dist<128&&e.cool<.15&&Math.random()<dt*9){e.guard=true;e.guardTime=.18+Math.random()*.18;e.cool=.12}else if(dist>82){e.vx=lerp(e.vx,e.face*(easy?210:dist>160?385:260),Math.min(1,dt*19))}else{e.vx=lerp(e.vx,0,Math.min(1,dt*24));if(e.cool<0&&Math.abs(e.y-p.y)<75){attack(e,Math.random()<.55?'punch':'kick');e.cool=easy?.85:.28+Math.random()*.14}}}}else if(e.atk){e.guard=false;e.vx=lerp(e.vx,e.face*35,dt*16)}}
for(let f of [p,e]){f.inv=Math.max(0,f.inv-dt);f.stun=Math.max(0,f.stun-dt);f.dash=Math.max(0,f.dash-dt);if(f.atk&&!f.dead&&!result){f.at+=dt;let a=moves[f.atk];if(!f.hit&&f.at>=a.hit&&f.at<a.hit+.105)strike(f,f===p?e:p);if(f.atk&&f.at>=a.dur){let b=f.buffer;f.atk=null;f.buffer=null;if(b)attack(f,b)}}if(f.stun>0||f.dead||result)f.vx*=Math.pow(.045,dt);f.x=clamp(f.x+f.vx*dt,42,W-42);f.vy+=1900*dt;f.y+=f.vy*dt;if(f.y>=F){if(f.vy>420)burst(f.x,F,'#8b98aa',6,100);f.y=F;f.vy=0}f.phase+=Math.abs(f.vx)*dt*.043;}
if(!result&&Math.abs(p.y-e.y)<48&&Math.abs(p.x-e.x)<38){let s=p.x<=e.x?-1:1,o=(38-Math.abs(p.x-e.x))*.5;p.x=clamp(p.x+s*o,42,W-42);e.x=clamp(e.x-s*o,42,W-42)}
fx=fx.filter(v=>v.life>0);for(let v of fx){v.x+=v.vx*dt;v.y+=v.vy*dt;v.vy+=380*dt;v.life-=dt}labels=labels.filter(v=>v.life>0);for(let v of labels){v.life-=dt;v.y-=dt*38}trails=trails.filter(v=>v.life>0);for(let v of trails)v.life-=dt;}
function line(a,b,col,w){g.strokeStyle=col;g.lineWidth=w;g.lineCap='round';g.beginPath();g.moveTo(...a);g.lineTo(...b);g.stroke()}
function circle(x,y,r,col){g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,6.283);g.fill()}
function pose(f,dt){let run=clamp(Math.abs(f.vx)/425,0,1),s=Math.sin(f.phase),z=Math.cos(f.phase),bob=Math.abs(s)*run*4;let q=[0,-45,5+run*10,-83+bob,6+run*12,-100+bob,-16-s*18*run,-65,-2-s*19*run,-79,17+s*18*run,-65,29+s*12*run,-79,-14+s*26*run,-23,-21+s*35*run,-Math.max(0,z)*16*run,15-s*26*run,-23,20-s*35*run,-Math.max(0,-z)*16*run];
if(f.y<F-7){q[14]=-16;q[15]=-29;q[16]=-29;q[17]=-12;q[18]=23;q[19]=-28;q[20]=27;q[21]=-8}if(f.guard){q[2]=-6;q[4]=-6;q[6]=9;q[7]=-66;q[8]=13;q[9]=-96;q[10]=23;q[11]=-64;q[12]=29;q[13]=-94;q[14]=-20;q[16]=-28;q[18]=21;q[20]=29}if(f.stun>0){q[2]=-16;q[4]=-20;q[6]=-28;q[8]=-42;q[9]=-62;q[12]=28;q[13]=-56}
if(f.atk){let t=clamp(f.at/moves[f.atk].dur,0,1),v=Math.pow(Math.sin(Math.PI*t),.5);if(f.atk==='punch'){q[2]=5+14*v;q[4]=6+15*v;q[10]=17+31*v;q[11]=-72-10*v;q[12]=28+49*v;q[13]=-81;q[16]=-30;q[20]=27}else if(f.atk==='kick'){q[2]=4-23*v;q[4]=6-26*v;q[18]=15+31*v;q[19]=-24-19*v;q[20]=20+77*v;q[21]=-65*v;q[6]=-20;q[8]=-32}else{q[2]=-18;q[3]=-77;q[4]=-25;q[5]=-94;q[14]=-23;q[15]=-28;q[16]=-38;q[17]=-38;q[18]=40;q[19]=-47;q[20]=94;q[21]=-48;q[6]=-32;q[8]=-44}}
if(!f.pose)f.pose=q;else f.pose=f.pose.map((n,i)=>lerp(n,q[i],Math.min(1,dt*(f.atk?48:25))));}
function stick(f,ghost=false){let q=f.pose;if(!q)return;g.save();g.translate(f.x,f.y);g.scale(f.face,1);if(f.dead){g.rotate(-1.48);g.translate(-24,15)}let col=ghost?'#91b9ef':f.inv>0&&!f.dead?'#ffffff':f.col;let hip=q.slice(0,2),sh=q.slice(2,4),head=q.slice(4,6);for(let [a,b,base] of [[6,8,sh],[10,12,sh],[14,16,hip],[18,20,hip]]){line(base,q.slice(a,a+2),col,5.5);line(q.slice(a,a+2),q.slice(b,b+2),col,5.5)}line(hip,sh,col,7);circle(...head,11.5,col);if(!f.enemy){line([head[0]-10,head[1]-4],[head[0]+10,head[1]-4],'#fe5461',3);line([head[0]-10,head[1]-4],[head[0]-25-Math.abs(f.vx)*.035,head[1]+Math.sin(time*18)*4],'#fe5461',3)}if(f.guard&&!ghost){g.strokeStyle='#6bcfff9c';g.lineWidth=3;g.beginPath();g.arc(2,-65,43,-1.15,1.15);g.stroke()}if(f.atk&&f.at<moves[f.atk].hit+.11&&!ghost){g.strokeStyle=f.atk==='punch'?'#fff5':'#ffd18b88';g.lineWidth=6;g.beginPath();if(f.atk==='punch'){g.moveTo(q[12]-34,q[13]);g.lineTo(q[12]+6,q[13])}else{g.arc(0,-45,86,-.7,.4)}g.stroke()}g.restore();}
function background(){let gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#141a2b');gr.addColorStop(1,'#414b61');g.fillStyle=gr;g.fillRect(0,0,W,H);circle(650,94,38,'#bacce044');for(let i=0;i<20;i++){let x=i*43,h=65+i*71%150;g.fillStyle='#252e40';g.fillRect(x,320-h,35,h);for(let j=0;j<5;j++){g.fillStyle=(i+j)%3?'#38465a':'#c8ac6b55';g.fillRect(x+8,330-h+j*22,5,10)}}for(let i=0;i<10;i++){let x=i*90,h=55+i*39%112;g.fillStyle='#1a2433';g.fillRect(x,F-h,65,h);g.fillStyle='#34465b';g.fillRect(x-4,F-h,73,5)}g.fillStyle='#111924';g.fillRect(0,F,W,H-F);line([0,F],[W,F],'#71849a',2);for(let i=0;i<12;i++)line([i*80-30,H],[i*70,F+8],'#2a3645',1);g.fillStyle='#9fb1c01c';g.font='900 28px system-ui';g.textAlign='center';g.fillText('COMBAT DISTRICT 02',400,250)}
function hud(){for(let f of [p,e]){let x=f.enemy?510:20;g.fillStyle='#0e1422';g.fillRect(x,29,270,24);g.fillStyle='#3a4557';g.fillRect(x+4,33,262,16);let w=f.hp*2.62;g.fillStyle=f.enemy?'#f45c68':'#78e3ba';g.fillRect(f.enemy?x+266-w:x+4,33,w,16);g.fillStyle='#fff';g.font='bold 12px system-ui';g.textAlign=f.enemy?'right':'left';g.fillText(f.enemy?'RIVAL / 02':'PLAYER / 01',f.enemy?780:20,20);g.textAlign='center';g.font='bold 11px monospace';g.fillText(f.hp+' / 100',x+135,45)}g.font='bold 24px monospace';g.fillStyle='#f3f5fa';g.textAlign='center';g.fillText(Math.floor(time)+'s',400,47);g.textAlign='left';g.font='12px monospace';g.fillStyle='#c4d1e3';g.fillText('SCORE '+score,20,75);g.fillText('BLOCKS '+blocks,20,92);if(combo>1){g.fillStyle='#ffd18b';g.font='italic 900 32px system-ui';g.fillText(combo+' HIT',20,133)}}
function render(dt){pose(p,dt);pose(e,dt);g.save();if(shake>0)g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);background();for(let f of [p,e]){g.fillStyle='#0007';g.beginPath();g.ellipse(f.x,F+2,Math.max(9,28-(F-f.y)*.09),5,0,0,6.283);g.fill()}for(let v of trails){g.globalAlpha=v.life*2;stick({...p,...v},true);g.globalAlpha=1}stick(e);stick(p);for(let v of fx){g.globalAlpha=clamp(v.life*3,0,1);line([v.x,v.y],[v.x-v.vx*.025,v.y-v.vy*.025],v.col,2.6)}g.globalAlpha=1;for(let v of labels){g.globalAlpha=clamp(v.life*3,0,1);g.font='italic 900 22px system-ui';g.fillStyle=v.col;g.textAlign='center';g.fillText(v.t,v.x,v.y)}g.globalAlpha=1;g.restore();hud();if(!started||result){g.fillStyle='#080e19c9';g.fillRect(0,122,W,171);g.textAlign='center';g.fillStyle=result==='DEFEAT'?'#ff6873':'#f8e2bd';g.font='italic 950 46px system-ui';g.fillText(result?'K.O. '+result:'READY TO FIGHT?',W/2,185);g.fillStyle='#d4deec';g.font='bold 15px system-ui';g.fillText(result?'Score: '+score+'   |   Blocks: '+blocks:'Faster movement. Smarter opponent. New defenses.',W/2,222);g.font='13px system-ui';g.fillText(result?'Press R or Restart':'Press Start or any movement key',W/2,252)}}
reset(false);function loop(now){let dt=clamp((now-last)/1000,0,.033);last=now;update(dt);render(dt);requestAnimationFrame(loop)}requestAnimationFrame(loop);
})();
</script></body></html>
